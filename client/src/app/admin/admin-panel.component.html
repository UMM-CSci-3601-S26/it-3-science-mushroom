<div class="admin-panel-container">
  <section class="admin-summary-band">
    <div>
      <h1>Admin Panel</h1>
      <p>Welcome, {{ authService.displayName || 'Admin' }}</p>
    </div>
  </section>

  <section class="missing-item-info">
    <div class="missing-item-header">
      <h2 class="missing-item-title">Needed Items</h2>
      <p class="missing-item-description">Items families needed but did not receive through POS.</p>
    </div>
    <div class="missing-item-stat">
      <span class="missing-item-count">0</span>
      <span class="missing-item-label">Open logs</span>
    </div>
  </section>
</div>
